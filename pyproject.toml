[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revenue-retention-lab"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pandas>=2.2,<3", "streamlit>=1.40,<2", "scikit-learn>=1.5,<2"]

[tool.setuptools.packages.find]
where = ["src"]
